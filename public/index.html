<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dune: Awakening - Interactive Map</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Mobile Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Collapsible / Off-canvas Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-badge">DA</div>
          <div>
            <h1 class="brand-title">ARRAKIS MAP</h1>
            <span class="brand-sub">Self-Hosted Companion</span>
          </div>
        </div>
        <button id="sidebar-toggle" class="icon-btn" title="Close Panel">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Map Selector -->
      <div class="control-section">
        <label class="section-label">SELECT MAP REGION</label>
        <select id="map-select" class="custom-select"></select>
      </div>

      <!-- Search Bar -->
      <div class="control-section">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="Search POIs, caves, labs, wrecks..." />
          <button id="clear-search" class="clear-btn" style="display: none;">&times;</button>
        </div>
      </div>

      <!-- Discovery Progress Tracker -->
      <div class="control-section discovery-section">
        <div class="discovery-header">
          <span class="section-label">DISCOVERY PROGRESS</span>
          <span id="discovery-percent" class="discovery-badge">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="discovery-progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="discovery-stats">
          <span id="discovery-count">0 / 0 Discovered</span>
          <button id="reset-discoveries-btn" class="text-btn">Reset</button>
        </div>
      </div>

      <!-- Categories & Filters -->
      <div class="control-section filters-section">
        <div class="filters-header">
          <span class="section-label">CATEGORIES</span>
          <div class="filter-actions">
            <button id="select-all-btn" class="text-btn">All</button>
            <span class="divider">|</span>
            <button id="deselect-all-btn" class="text-btn">None</button>
          </div>
        </div>
        <div id="categories-list" class="categories-list">
          <!-- Dynamic category list populated by JS -->
        </div>
      </div>

      <!-- Custom Pin Action -->
      <div class="control-section custom-actions">
        <button id="add-pin-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add Custom Marker
        </button>
      </div>

      <!-- Footer Info -->
      <div class="sidebar-footer">
        <div class="server-status">
          <span class="status-dot"></span>
          <span>Docker Server Active</span>
        </div>
      </div>
    </aside>

    <!-- Map Canvas Area -->
    <main class="map-container">
      <!-- Top Mobile Bar -->
      <header class="mobile-top-bar">
        <div class="mobile-top-brand">
          <span class="mobile-brand-tag">DA</span>
          <span id="mobile-current-map" class="mobile-map-title">Hagga Basin</span>
        </div>
        <div id="mobile-coords-chip" class="mobile-coords-chip">X: 0 | Y: 0</div>
      </header>

      <!-- Leaflet Map -->
      <div id="map"></div>

      <!-- Desktop Floating HUD: Coordinates & Navigation -->
      <div class="floating-hud desktop-only">
        <div class="hud-item coords-hud">
          <span class="hud-label">COORDINATES (UNREAL UNITS)</span>
          <span id="cursor-coords" class="hud-value">X: 0 | Y: 0</span>
        </div>
        
        <div class="hud-item goto-hud">
          <input type="number" id="goto-x" placeholder="X" />
          <input type="number" id="goto-y" placeholder="Y" />
          <button id="goto-btn" class="btn-sm">Go To</button>
        </div>
      </div>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="mobile-bottom-nav">
        <button id="mob-btn-regions" class="mob-nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
          <span>Regions</span>
        </button>
        <button id="mob-btn-filters" class="mob-nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span>Filters</span>
        </button>
        <button id="mob-btn-search" class="mob-nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search</span>
        </button>
        <button id="mob-btn-add" class="mob-nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span>Add Pin</span>
        </button>
      </nav>
    </main>
  </div>

  <!-- Modal: Add Custom Marker -->
  <div id="marker-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">New Marker</h3>
        <button id="close-modal-btn" class="icon-btn">&times;</button>
      </div>
      <form id="marker-form">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="modal-title" required placeholder="e.g. Rich Spice Deposit, Clan Base" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="modal-category">
            <option value="Spice Blows">Spice Blows</option>
            <option value="Bunkers & Labs">Bunkers & Labs</option>
            <option value="Crashed Ships">Crashed Ships</option>
            <option value="Water & Extraction">Water & Extraction</option>
            <option value="Caves & POIs">Caves & POIs</option>
            <option value="Vendors & Trainers">Vendors & Trainers</option>
            <option value="Fast Travel & Landmarks">Fast Travel & Landmarks</option>
            <option value="Custom Pins" selected>Custom Pins</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>X (Coordinate)</label>
            <input type="number" id="modal-x" required />
          </div>
          <div class="form-group">
            <label>Y (Coordinate)</label>
            <input type="number" id="modal-y" required />
          </div>
        </div>
        <div class="form-group">
          <label>Notes / Description</label>
          <textarea id="modal-desc" rows="3" placeholder="Access code, enemy threat level, respawn time..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Pin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
